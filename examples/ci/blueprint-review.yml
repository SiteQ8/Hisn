# Review the security blueprints in a repository on every push and pull request.
#
# Copy this into .github/workflows/ in your own repository. It fails the run when
# any blueprint has a high finding, so an architecture change that moves sensitive
# data without naming a control does not merge quietly.
name: blueprint review

on:
  push:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Review every blueprint
        run: |
          shopt -s globstar nullglob
          failed=0
          for f in **/*.hisn; do
            echo "== $f"
            npx --yes github:SiteQ8/Hisn check "$f" --strict || failed=1
          done
          exit $failed
